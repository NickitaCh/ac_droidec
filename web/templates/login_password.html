{% extends "base.html" %}
{% block title %}Вход по паролю — AC Droidec{% endblock %}
{% block content %}
    <h1>Вход по логину и паролю</h1>
    <p class="muted">Для тех, у кого нет доступа к Discord. Учётку заводит супер-админ.</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <div class="panel" style="max-width: 24em;">
        <form method="post" action="/login/password">
            <label>
                Логин
                <input type="text" name="login" autocomplete="username" required autofocus>
            </label>
            <label>
                Пароль
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Войти</button>
        </form>
    </div>

    <p><a href="/login">← Войти через Discord</a></p>
{% endblock %}
