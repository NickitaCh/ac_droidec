<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Моя карта ТБ{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>html,body{min-height:0;height:auto;margin:0;background:var(--surface)}body{display:block}main.tb-map-embedded{margin:0;padding:1px;width:100%;max-width:none;box-sizing:border-box;min-height:0}</style>
  <script>if(parent!==window){const theme=parent.document.documentElement.getAttribute('data-theme');if(theme)document.documentElement.setAttribute('data-theme',theme);}</script>
</head>
<body><main class="tb-map-embedded">{% block content %}{% endblock %}</main>
<script>
(() => {
  const main=document.querySelector('main');
  const resize=()=>parent.postMessage({type:'tb-map-height',height:Math.ceil(main.getBoundingClientRect().height)},location.origin);
  new ResizeObserver(resize).observe(main);
  window.addEventListener('load',resize);
})();
</script>
</body></html>
