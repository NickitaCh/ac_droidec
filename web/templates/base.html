<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AC Droidec{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/dashboard.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">AC Droidec</a>
        <nav>
            {% if user %}
                {% if user.guild_id is not none %}
                    <a href="/roster">Состав</a>
                    <a href="/tb">ТБ</a>
                    <a href="/violations">Нарушения</a>
                    <a href="/registration">Регистрация</a>
                {% endif %}
                <span class="user">{{ user.username }}{% if guild_cfg %} · {{ guild_cfg.name }}{% endif %}</span>
                <a href="/logout">Выйти</a>
            {% else %}
                <a href="/login">Войти через Discord</a>
            {% endif %}
        </nav>
    </header>
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
