{% extends "base.html" %}
{% block title %}Вход через Telegram{% endblock %}
{% block content %}
<div class="page-hero"><h1>Вход через Telegram</h1></div>
<div class="card" style="max-width:36rem;margin:2rem auto">
  {% if error %}<p>{{ error }}</p>{% else %}
  <p>Войти как <strong>{{ name }}</strong> и открыть подключение EA?</p>
  <form method="post" action="/login/telegram">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="btn btn-primary">Войти и продолжить</button>
  </form>
  {% endif %}
</div>
{% endblock %}
